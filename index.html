<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Familie">
<meta name="theme-color" content="#D6DFE7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Familien-Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600&family=Nunito:wght@400;600;800&family=Lexend:wght@400;600&family=Andika:wght@400;700&display=swap">
<style>
/* Layout: Flur-Tafel wie ein Sticker-Wochenplan – je Kind eine Karte mit Wochenleiste und großen Aufgabenknöpfen; Eltern-Bereich hinter PIN. Bewusst nur heller Modus. */
:root{
  --bg:#D6DFE7; --surface:#FFFFFF; --ink:#1C2A39; --muted:#4F5F6F; --line:#C3CED8;
  --accent:#22497F; --accent-ink:#FFFFFF;
  --good:#2C8452; --good-bg:#E2F2E8; --wait:#B77A05; --wait-bg:#FBF0D6; --redo:#BE3F55; --redo-bg:#F8E2E6;
  --font-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
  color-scheme:light;
}
html,body{background:color-mix(in srgb,var(--tint,var(--bg)) 18%,var(--bg));color:var(--ink)}
/* dunkle Ansicht (im Eltern-Bereich umschaltbar) */
:root[data-theme="dunkel"]{--bg:#10151B;--surface:#1A222B;--ink:#E9EEF3;--muted:#A3B1BF;--line:#303C48;--accent:#7AA7FF;--accent-ink:#0C1422;
  --good:#52C28A;--good-bg:#173023;--wait:#E7B24C;--wait-bg:#332811;--redo:#FF8094;--redo-bg:#3A1C22;color-scheme:dark}
:root[data-theme="dunkel"],:root[data-theme="dunkel"] body{background:color-mix(in srgb,var(--tint,var(--bg)) 10%,var(--bg))}
:root[data-theme="dunkel"] #toast{background:#E9EEF3;color:#10151B}
:root[data-theme="dunkel"] .today .btn.primary{color:#fff}
:root[data-theme="dunkel"] :is(.pts b,.task .pp,.cost,.dep .cd){color:color-mix(in srgb,var(--kid,var(--accent)) 55%,#fff)}
:root[data-theme="dunkel"] .today .panel h2,:root[data-theme="dunkel"] .today .kid-body h3{color:color-mix(in srgb,var(--kid) 50%,#fff)}
:root[data-theme="dunkel"] .stk.full{color:#0C1422}
:root[data-font="nunito"]{--font-display:"Nunito",system-ui,sans-serif;--font-body:"Nunito",system-ui,sans-serif}
:root[data-font="nunito"] h1,:root[data-font="nunito"] h2,:root[data-font="nunito"] h3,:root[data-font="nunito"] .tab,:root[data-font="nunito"] .person{font-weight:800}
:root[data-font="lexend"]{--font-display:"Lexend",system-ui,sans-serif;--font-body:"Lexend",system-ui,sans-serif}
:root[data-font="andika"]{--font-display:"Andika",system-ui,sans-serif;--font-body:"Andika",system-ui,sans-serif}
:root[data-font="andika"] h1,:root[data-font="andika"] h2,:root[data-font="andika"] h3,:root[data-font="andika"] .tab,:root[data-font="andika"] .person{font-weight:700}
/* frei wählbare Schriften: Überschriften, Texte */
:root[data-headfont="andika"]{--font-display:"Andika",system-ui,sans-serif;--head-weight:700}
:root[data-bodyfont="andika"]{--font-body:"Andika",system-ui,sans-serif}
:root[data-headfont="atkinson"]{--font-display:"Atkinson Hyperlegible",system-ui,sans-serif;--head-weight:700}
:root[data-bodyfont="atkinson"]{--font-body:"Atkinson Hyperlegible",system-ui,sans-serif}
:root[data-headfont="nunito"]{--font-display:"Nunito",system-ui,sans-serif;--head-weight:800}
:root[data-bodyfont="nunito"]{--font-body:"Nunito",system-ui,sans-serif}
:root[data-headfont="lexend"]{--font-display:"Lexend",system-ui,sans-serif;--head-weight:600}
:root[data-bodyfont="lexend"]{--font-body:"Lexend",system-ui,sans-serif}
:root[data-headfont="fredoka"]{--font-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;--head-weight:600}
:root[data-bodyfont="fredoka"]{--font-body:"Fredoka","Trebuchet MS",system-ui,sans-serif}
:root[data-headfont] :is(h1,h2,h3,.date .dow,.pts b,.cost,.wx-big b,.school-head b){font-weight:var(--head-weight)}
/* eigene Schrift für Knöpfe */
:root[data-btnfont="fredoka"],:root[data-btnfont="standard"]{--font-btn:"Fredoka","Trebuchet MS",system-ui,sans-serif;--btn-weight:500}
:root[data-btnfont="atkinson"]{--font-btn:"Atkinson Hyperlegible",system-ui,sans-serif;--btn-weight:700}
:root[data-btnfont="nunito"]{--font-btn:"Nunito",system-ui,sans-serif;--btn-weight:800}
:root[data-btnfont="lexend"]{--font-btn:"Lexend",system-ui,sans-serif;--btn-weight:600}
:root[data-btnfont="andika"]{--font-btn:"Andika",system-ui,sans-serif;--btn-weight:700}
:root[data-btnfont] :is(.btn,.tab,.person,.chip,.wx-chip,.banner,.task .tt,.pad button){font-family:var(--font-btn);font-weight:var(--btn-weight)}
.today .panel{border-color:color-mix(in srgb,var(--kid) 45%,var(--line));background:color-mix(in srgb,var(--kid) 7%,var(--surface))}
.today .panel h2{color:color-mix(in srgb,var(--kid) 72%,var(--ink))}
.today .ev{background:color-mix(in srgb,var(--kid) 11%,var(--surface))}
.today .item{background:var(--surface)}
.today .kid{border:3px solid var(--kid)}
.today .kid-head{background:color-mix(in srgb,var(--kid) 26%,var(--surface))}
.today .kid-body h3{color:color-mix(in srgb,var(--kid) 72%,var(--ink))}
.today .btn.primary{background:var(--kid);border-color:var(--kid)}
.today .bar{background:color-mix(in srgb,var(--kid) 18%,var(--surface))}
body{font-family:var(--font-body);font-size:17px;line-height:1.4}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.date{display:flex;flex-direction:column;line-height:1.1}
.date .dow{font-family:var(--font-display);font-size:1.9rem;font-weight:600}
.date .dm{color:var(--muted);font-size:1.05rem}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{min-height:56px;padding:0 18px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-family:var(--font-display);font-weight:500;font-size:1.1rem;display:inline-flex;align-items:center;gap:8px}
.tab[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.badge{min-width:26px;height:26px;padding:0 7px;border-radius:999px;background:var(--wait);color:#fff;font-size:.9rem;display:inline-grid;place-items:center;font-family:var(--font-body);font-weight:700}

.banner{width:100%;min-height:60px;border-radius:var(--r);border:2px solid var(--wait);background:var(--wait-bg);font-size:1.15rem;font-weight:700;display:flex;align-items:center;gap:12px;padding:10px 18px;text-align:left}
.banner.due{border-color:var(--redo);background:var(--redo-bg)}

.kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:18px}
.kid{background:var(--surface);border:2px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.kid-head{background:color-mix(in srgb,var(--kid) 13%,var(--surface));padding:14px 16px;display:flex;align-items:center;gap:12px}
.avatar{width:68px;height:68px;border-radius:50%;background:var(--surface);border:3px solid var(--kid);display:grid;place-items:center;font-size:1.9rem;flex:none;overflow:hidden}
.avatar img,.mini img{width:100%;height:100%;object-fit:cover;display:block}
.mini{width:34px;height:34px;border-radius:50%;overflow:hidden;display:inline-grid;place-items:center;font-size:1.2rem;flex:none;border:2px solid var(--kid,var(--line));background:var(--surface)}
.photo-edit{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.kid-head h2{font-size:1.7rem;flex:1;min-width:0;overflow-wrap:anywhere}
.pts{text-align:right;line-height:1}
.pts b{font-family:var(--font-display);font-size:2.2rem;color:var(--kid);font-variant-numeric:tabular-nums;display:block}
.pts small{color:var(--muted);font-size:.85rem}
.kid-body{padding:14px 16px 18px;display:flex;flex-direction:column;gap:14px}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.week .d{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.85rem;color:var(--muted)}
.week .d.today{color:var(--ink);font-weight:700}
.stk{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;border:2px dashed var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.stk.part{border:2px solid var(--kid);color:var(--ink);background:color-mix(in srgb,var(--kid) 10%,var(--surface))}
.stk.full{border:2px solid var(--kid);background:var(--kid);color:#fff;font-size:1.05rem}
.stk.none{border-style:solid;border-color:transparent}
.stk.future{opacity:.55}
.bar{height:16px;border-radius:999px;background:color-mix(in srgb,var(--kid) 12%,var(--bg));overflow:hidden}
.bar span{display:block;height:100%;background:var(--kid);border-radius:999px;transition:width .4s}
.barlabel{margin:-6px 0 0;color:var(--muted);font-size:.95rem;display:flex;justify-content:space-between;gap:8px}

.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.task{width:100%;min-height:76px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:10px;padding:8px 14px;text-align:left}
.task .em{font-size:2rem;text-align:center}
.task .tt{font-weight:700;font-size:1.15rem;display:block}
.task .st{font-size:.92rem;color:var(--muted)}
.task .pp{font-family:var(--font-display);font-size:1.25rem;color:var(--kid);font-variant-numeric:tabular-nums}
.task.pending{border-color:var(--wait);background:var(--wait-bg)}
.task.pending .st{color:var(--wait);font-weight:700}
.task.approved{border-color:var(--good);background:var(--good-bg)}
.task.approved .st{color:var(--good);font-weight:700}
.task.redo{border-color:var(--redo);background:var(--redo-bg)}
.task.redo .st{color:var(--redo);font-weight:700}
.persons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.person{min-height:84px;border-radius:20px;border:2px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:10px;padding:8px 12px;font-family:var(--font-display);font-size:1.25rem;font-weight:600;min-width:0;text-align:left}
.person .avatar{width:58px;height:58px}
.person .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .nmw{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.person .sub{font-family:var(--font-body);font-size:.8rem;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person[aria-pressed="true"]{border-color:var(--kid);background:color-mix(in srgb,var(--kid) 15%,var(--surface));box-shadow:inset 0 0 0 2px var(--kid)}
@media (max-width:640px){.persons{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1000px){.persons{gap:8px}.persons .person{padding:6px 8px;gap:8px;font-size:1.05rem;min-height:64px}.persons .person .avatar{width:44px;height:44px;border-width:2px}.persons .person .sub{font-size:.74rem}}
.today{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.today .side{display:flex;flex-direction:column;gap:18px;min-width:0}
.today .main{order:-1;min-width:0}
@media (min-width:900px), (min-width:720px) and (min-aspect-ratio:9/10){.today{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}.today .main{order:0}}
@media (min-width:900px) and (orientation:landscape), (min-width:720px) and (min-aspect-ratio:9/10), (min-width:700px) and (max-aspect-ratio:9/10){
  html,body{height:100%}
  html{box-sizing:border-box}
  #app.fit{height:100%;padding-block:8px;overflow:hidden;gap:10px;font-size:16px}
  #app.fit .top{gap:8px}
  #app.fit .date{flex-direction:row;align-items:baseline;gap:10px}
  #app.fit .date .dow{font-size:1.3rem}
  #app.fit .date .dm{font-size:.95rem}
  #app.fit .tab{min-height:42px;padding:0 14px;font-size:.98rem}
  #app.fit .banner{min-height:44px;padding:6px 14px;font-size:1rem}
  #app.fit .persons{gap:8px}
  #app.fit .persons .person{min-height:52px;padding:5px 10px;font-size:1.05rem;border-radius:16px;gap:8px}
  #app.fit .persons .avatar{width:40px;height:40px;font-size:1.3rem;border-width:2px}
  #app.fit .today{flex:1;min-height:0;grid-template-rows:minmax(0,1fr);gap:14px}
  #app.fit .side{gap:14px}
  #app.fit .side,#app.fit .main{min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:12px;border-radius:18px}
  #app.fit .panel{padding:14px;gap:10px;border-radius:18px}
  #app.fit .panel h2{font-size:1.1rem}
  #app.fit .panel .btn.small{min-height:38px;padding:0 12px;font-size:.9rem}
  #app.fit .cal{gap:10px}
  #app.fit .cal-day h3{font-size:.75rem}
  #app.fit .ev{padding:6px 10px;grid-template-columns:54px minmax(0,1fr) auto}
  #app.fit .ev .ti{font-size:.95rem}
  #app.fit .ev .tm{font-size:.9rem}
  #app.fit .ev .who .mini{width:24px;height:24px}
  #app.fit .field input,#app.fit .field select{min-height:44px}
  #app.fit .field label{font-size:.8rem}
  #app.fit .item{padding:6px 10px}
  #app.fit .check{width:44px;height:44px;font-size:1.2rem}
  #app.fit .kid{border-radius:18px}
  #app.fit .kid-head{padding:10px 14px}
  #app.fit .kid-head .avatar{width:54px;height:54px}
  #app.fit .kid-head h2{font-size:1.35rem}
  #app.fit .pts b{font-size:1.8rem}
  #app.fit .kid-body{padding:12px 14px 14px;gap:12px}
  #app.fit .kid-body h3{font-size:1.05rem}
  #app.fit .stk{width:32px;height:32px}
  #app.fit .task{min-height:64px;padding:6px 12px}
  #app.fit .task .em{font-size:1.7rem}
  #app.fit .task .tt{font-size:1.05rem}
  #app.fit .btn{min-height:46px;font-size:.98rem}
  #app.fit .chip{min-height:44px}
}
@media (min-width:700px) and (max-aspect-ratio:9/10){
  #app.fit .today{display:flex;flex-direction:column;gap:12px}
  #app.fit .main{order:0;flex:0 1 auto;max-height:64%}
  #app.fit .today .side{flex:1 1 auto}
  #app.fit .side{order:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-content:start;gap:12px}
  #app.fit .side > .panel:first-child{grid-row:span 2}
}
.cal{display:flex;flex-direction:column;gap:14px}
.wx-chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:4px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-family:var(--font-display);font-size:1.15rem;font-weight:600}
.wx-chip .ic{font-size:1.5rem;line-height:1}
.wx-chip small{font-family:var(--font-body);font-size:.85rem;font-weight:700;color:var(--muted)}
.wx-now{display:flex;flex-wrap:wrap;align-items:center;gap:16px 28px}
.wx-big{display:flex;align-items:center;gap:14px}
.wx-big .ic{font-size:4.5rem;line-height:1}
.wx-big b{font-family:var(--font-display);font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.wx-big .ph{font-size:1.2rem;font-weight:700}
.wx-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;flex:1 1 300px}
.wx-facts div{background:var(--bg);border-radius:12px;padding:8px 12px}
.wx-facts small{display:block;color:var(--muted);font-size:.8rem;font-weight:700}
.wx-tip{border-radius:14px;padding:12px 16px;background:var(--wait-bg);border:2px solid var(--wait);font-weight:700;font-size:1.1rem}
.wx-hours{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.wx-hours div{flex:0 0 76px;text-align:center;background:var(--bg);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.wx-hours .ic{font-size:1.6rem}
.wx-hours .rp{color:var(--accent);font-size:.85rem;font-weight:700}
.wx-days{display:flex;flex-direction:column;gap:6px}
.wx-day{display:grid;grid-template-columns:90px 40px minmax(0,1fr) 92px 60px;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--bg);font-variant-numeric:tabular-nums}
.wx-day .ic{font-size:1.6rem;text-align:center}
.wx-day .ph{min-width:0;overflow-wrap:anywhere;color:var(--muted)}
.wx-day .rp{color:var(--accent);font-weight:700;text-align:right}
@media (max-width:560px){.wx-day{grid-template-columns:70px 34px minmax(0,1fr) 80px}.wx-day .ph{display:none}}
.cal-day{display:flex;flex-direction:column;gap:6px}
.cal-day h3{font-family:var(--font-body);font-size:.85rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.ev{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;background:var(--bg)}
.ev .tm{font-variant-numeric:tabular-nums;font-weight:700}
.ev .ti{min-width:0;overflow-wrap:anywhere;font-size:1.02rem}
.ev .ti small{display:block;color:var(--muted);font-size:.85rem}
.ev .who{display:flex;gap:3px;align-items:center}
.ev .who .mini{width:28px;height:28px;font-size:.95rem}
.ev .all{font-size:.8rem;font-weight:700;color:var(--muted)}
.note{color:var(--muted);margin:0}
.calrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:10px 14px}
.calrow .tx{flex:1 1 180px;min-width:0;overflow-wrap:anywhere;font-weight:700}
.calrow select{min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--surface);padding:0 10px}
.calrow label{display:flex;align-items:center;gap:6px;color:var(--muted)}
.calrow input[type=checkbox]{width:22px;height:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.school{border-radius:16px;background:color-mix(in srgb,var(--kid) 9%,var(--surface));border:2px solid color-mix(in srgb,var(--kid) 35%,var(--line));padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.school-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px}
.school-head b{font-family:var(--font-display);font-size:1.1rem}
.school-head span{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:700}
.lessons{display:flex;flex-wrap:wrap;gap:6px}
.lesson{display:inline-flex;align-items:baseline;gap:6px;border-radius:10px;background:var(--surface);border:1px solid var(--line);padding:4px 10px;font-size:.95rem}
.lesson small{color:var(--muted);font-variant-numeric:tabular-nums}
.lesson.opt{border-style:dashed;color:var(--muted)}
.lesson.hi{border-color:var(--kid);background:color-mix(in srgb,var(--kid) 16%,var(--surface));font-weight:700}
.pack{border-radius:12px;background:var(--wait-bg);border:2px solid var(--wait);padding:8px 12px;font-weight:700}
.plan-wrap{overflow-x:auto}
.plan{border-collapse:collapse;width:100%;min-width:480px;font-size:.88rem}
.plan th,.plan td{border:1px solid var(--line);padding:5px 6px;text-align:center;background:var(--surface)}
.plan th{background:color-mix(in srgb,var(--kid) 14%,var(--surface));font-family:var(--font-display)}
.plan td.t{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted)}
.plan td.today{background:color-mix(in srgb,var(--kid) 10%,var(--surface));font-weight:700}
.plan tr.brk td{background:var(--bg);color:var(--muted);font-style:italic}

<script>

const WD = ['Mo','Di','Mi','Do','Fr','Sa','So'];

const S = {muell:[],plans:[],kids:[],tasks:[],rewards:[],done:[],adjust:[],vouchers:[],parent:[],allow:[],ptpl:[],adults:[],shop:[],atasks:[],adone:[],meals:[],todos:[],mensa:[],homeask:[],ktasks:[],pot:[],pack:[],seen:[],viewers:[],depart:[],share:[],settings:{},calcfg:{},ready:false,noDb:false,readOnly:false};
const UI = {tab:'heute', rewardKid:null, parentOk:false, pin:'', editTask:null, editReward:null, editKid:null, arm:null, draft:{days:[]}, adjKid:null, askFrom:null, askFor:'beide', more:null};

const pad = n => String(n).padStart(2,'0');

const num = v => Number(v) || 0;
const kidColor = k => COLORS[k?.color] || COLORS.blau;
const kidById = id => S.kids.find(k => k.id === id);
const kidName = id => kidById(id)?.name || 'Kind';
const sortKids = () => [...S.kids].sort((a,b) => num(a.order)-num(b.order) || String(a.name).localeCompare(b.name));

function balance(kid){
  let p = 0;

/* ---------- Stundenpläne ---------- */
const DAYNAMES = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag'];
function isoWeek(d){ const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y0) / 864e5 + 1) / 7); }

  }

}
const PACK = [[/schwimm/i, '🏊 Schwimmsachen'], [/sport/i, '👟 Sportzeug'], [/turn/i, '👟 Sportzeug']];
const packFor = lessons => [...new Set(lessons.filter(l => !l.opt).flatMap(l => PACK.filter(([re]) => re.test(l.txt)).map(([,t]) => t)))];
function schoolBox(k, tomorrow){
  const plan = planFor(k.id); if (!plan) return '';
  const now = new Date(), dow = isoDow(now);
  let showDow = dow, label = 'Schule heute', showDate = now;
  if (tomorrow) {
    showDate = addDays(now, 1); showDow = isoDow(showDate); label = 'Schule morgen';
    if (showDow > 5) return `<div class="school"><div class="school-head"><b>morgen</b><span>Wochenende – keine Schule 🎉</span></div></div>`;
  } else if (dow > 5) { showDow = 1; label = 'Schule am Montag'; showDate = addDays(now, 8 - dow); }
  const fr = freeReason(showDate);
  const lessons = fr ? [] : dayLessons(plan, showDow, showDate);
  const core = lessons.filter(l => !l.opt), opt = lessons.filter(l => l.opt);
  let end = core.length ? core[core.length-1].to : '';
  const ogsEnd = !fr && plan.ogs && plan.ogs[showDow];
  if (ogsEnd && end) { lessons.push({from:end, to:ogsEnd, txt:'OGS', opt:false}); end = ogsEnd; }

  const packToday = dow <= 5 && !freeReason(now) ? packFor(dayLessons(plan, dow, now)) : [];
  const tomorrowDow = dow === 7 ? 1 : dow + 1;
  const packTomorrow = (tomorrowDow <= 5 && now.getHours() >= 13 && !freeReason(addDays(now, 1))) ? packFor(dayLessons(plan, tomorrowDow, addDays(now, 1))) : [];

      ? `<tr class="brk"><td class="t">${esc(r.from)}–${esc(r.to)}</td><td colspan="5">${esc(r.break)}</td></tr>`

}
const isRot = t => Array.isArray(t.rotation) && t.rotation.length > 0;

const DEPART = {Charlotte:{bike:'07:26', bus:'07:07', busDep:'07:15'}, Helene:{bus:'07:48'}};
const hasSchool = (kid, date) => { const plan = planFor(kid); if (!plan || isoDow(date) > 5 || freeReason(date)) return false; return dayLessons(plan, isoDow(date), date).some(l => !l.opt); };
const wxHours = () => WX.hours && Array.isArray(WX.hours.hourlyForecast) ? WX.hours.hourlyForecast : [];
const pctOf = v => num(String(v ?? '').replace(/[^\d.]/g, ''));
function rideWeather(){
  const today = dkey(new Date());
  const rel = wxHours().filter(h => String(h.date || '').slice(0,10) === today && ['07','08'].includes(String(h.date).slice(11,13)));
  if (!rel.length) return null;
  const ex = h => h.extended || {}, why = [];
  const rain = Math.max(...rel.map(h => pctOf(ex(h).rainProbability !== undefined ? ex(h).rainProbability : h.precip)));
  if (rel.some(h => h.hasPrecip) || rain >= 50) why.push(`Regen ${rain} %`);
  if (Math.max(...rel.map(h => Math.max(pctOf(ex(h).snowProbability), pctOf(ex(h).iceProbability)))) >= 30) why.push('Schnee oder Eis');
  if (Math.min(...rel.map(h => Number(h.temperatureValue ?? 99))) <= 1) why.push('Glättegefahr');
  if (Math.max(...rel.map(h => num(ex(h).gustsValue))) >= 50) why.push('Sturm');
  return {bad:why.length > 0, why:why.join(', ')};
}
function departures(){
  const d = new Date(), key = dkey(d), out = [];
  const ov = S.depart.find(x => x.id === key) || {};
  for (const k of sortKids()) {
    const c = DEPART[k.name]; if (!c || !hasSchool(k.id, d)) continue;
    let mode = c.bike ? 'rad' : 'bus', why = '', w = null;
    if (c.bike && c.bus) { w = rideWeather(); if (ov[k.id] === 'rad' || ov[k.id] === 'bus') mode = ov[k.id]; else if (w && w.bad) { mode = 'bus'; why = w.why; } }
    out.push({k, mode, time:mode === 'rad' ? c.bike : c.bus, why, both:!!(c.bike && c.bus), busDep:c.busDep || '', manual:!!ov[k.id], wxKnown:!!w});
  }
  return out;
}

function computePapa(date){

async function putShare(id, data){
  const cur = shareDoc(id);
  if (cur) { const {id:_i, at:_a, ...rest} = cur; if (JSON.stringify(rest) === JSON.stringify(data)) return; }
  try { await col('share').doc(id).set({...data, at:Date.now()}); } catch (e) {}
}
async function pushShare(){
  const kidIds = sortKids().map(k => k.id);
  if (Object.keys(CAL.events).length) {
    const list = calEvents().filter(e => !/^🗑️/.test(e.title) && e.who.some(id => kidIds.includes(id))).slice(0, 40)
      .map(e => ({day:e.day, allDay:e.allDay, time:e.sTime ? hm(e.sTime) : '', title:e.title, who:e.who.filter(id => kidIds.includes(id)), until:e.until || ''}));
    await putShare('kidevents', {list});
    if (ferienCals().some(c => CAL.events[c.id])) await putShare('ferien', {list:ferienRanges()});
    const days = {};
    for (let i = 0; i < 14; i++) { const d = addDays(new Date(), i); days[dkey(d)] = computeHome(d); }
    await putShare('home', {days});
    for (const d of [new Date(), addDays(new Date(), 1)]) {
      if (isoDow(d) > 5 || freeReason(d)) continue;
      const h = computeHome(d), qid = `${dkey(d)}_papa`;
      if (h.ask && !S.homeask.some(x => x.id === qid)) { try { await col('homeask').doc(qid).set({date:dkey(d), who:'papa', reason:h.ask.reason, est:h.ask.est ? fromMin(h.ask.est) : '', answer:'', at:Date.now()}); } catch (e) {} }
    }
  }
  const c = wxNow(); if (c) await putShare('wx', {temperature:String(c.temperature || ''), iconCode:num(c.iconCode), phrase:String(c.phrase || ''), tip:wxTip()});
}

let toastT = null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600);
}
async function safe(fn, okMsg){
  if (!db) { toast('Speichern geht gerade nicht.'); return false; }
  if (S.readOnly) { toast('Dieses Gerät darf nur ansehen.'); return false; }
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch (e) {
    if (e && e.code === 'invalid_argument') { S.readOnly = true; render(); toast('Speichern nicht erlaubt. Bitte mit dem Familien-Konto anmelden.'); }
    else if (e && e.code === 'quota_exceeded') toast('Speicher voll. Bitte alte Einträge löschen.');
    else toast('Speichern ging nicht. Bitte nochmal tippen.');
    return false;
  }
}
const col = name => db.collection(name);

const inflight = new Set();
const untickArmed = id => UI.untick && UI.untick.id === id && Date.now() - UI.untick.at < 8000;
async function tick(taskId){
  const t = S.tasks.find(x => x.id === taskId) || S.ktasks.find(x => x.id === taskId); if (!t) return;
  const kid = t.onDemand ? t.kid : assigneeOn(t, new Date()); if (!kid) return;
  const date = dkey(new Date()), ex = doneFor(taskId, date), ref = col('done').doc(`${date}_${taskId}`);
  if (ex && ex.status === 'approved') { toast('schon geschafft!'); return; }
  const did = `${date}_${taskId}`;
  if (inflight.has(did)) return;
  if (ex && ex.status === 'pending') {
    if (!untickArmed(did)) { UI.untick = {id:did, at:Date.now()}; render(); toast('Nochmal tippen, um es zurückzunehmen.'); return; }
    UI.untick = null; inflight.add(did);
    await safe(() => ref.delete(), 'zurückgenommen'); inflight.delete(did); return;
  }
  const data = {taskId, kid, title:t.title, emoji:t.emoji || '', points:num(t.points), date, status:'pending', at:Date.now()};
  inflight.add(did);
  S.done = [...S.done.filter(x => x.id !== did), {id:did, ...data}]; render();
  const ok = await safe(() => ref.set(data), 'Super! Mama oder Papa schauen nach.');
  inflight.delete(did);
  if (!ok) { S.done = S.done.filter(x => !(x.id === did && x.at === data.at)); render(); }
}

function photoToDataUrl(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(img.naturalWidth, img.naturalHeight), c = document.createElement('canvas');
      c.width = c.height = 256;
      const sx = (img.naturalWidth - s) / 2, sy = Math.max(0, (img.naturalHeight - s) / 3);
      c.getContext('2d').drawImage(img, sx, sy, s, s, 0, 0, 256, 256);
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Bild')); };
    img.src = url;
  });
}

}
